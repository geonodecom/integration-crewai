name: Publish

# Manual only. PyPI accepts the upload once this repository is a trusted publisher
# for the package (workflow publish.yml, environment pypi or testpypi).
on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Where to publish after validation
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version and release notes
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = pathlib.Path("geonode_scraper_crewai/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init, re.MULTILINE)
          if not match or match.group(1) != version:
              raise SystemExit(f'geonode_scraper_crewai/__init__.py must set __version__ = "{version}"')

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(rf"^## \[{re.escape(version)}\](?: - .+)?$", changelog, re.MULTILINE)
          if not heading:
              raise SystemExit(f"CHANGELOG.md needs a heading for {version}")
          rest = changelog[heading.end():]
          following = re.search(r"^## \[", rest, re.MULTILINE)
          if not rest[: following.start() if following else None].strip():
              raise SystemExit(f"CHANGELOG.md needs release notes under {version}")
          PY

      - name: Install the package with dev dependencies
        run: python -m pip install -e ".[dev]" build twine

      - name: Run Ruff checks
        run: bash scripts/ruff.sh check

      - name: Run tests
        run: bash scripts/test.sh

      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        if: inputs.publish_target != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: dists-${{ github.sha }}
          path: dist/

  testpypi-publish:
    runs-on: ubuntu-latest
    needs: validate-build
    if: inputs.publish_target == 'testpypi'
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/geonode-scraper-crewai/

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: dists-${{ github.sha }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: validate-build
    if: inputs.publish_target == 'pypi'
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/geonode-scraper-crewai/

    steps:
      - name: Retrieve distributions
        uses: actions/download-artifact@v4
        with:
          name: dists-${{ github.sha }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
