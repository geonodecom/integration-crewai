[project]
name = "geonode-scraper-crewai"
version = "0.4.2"
description = "Give CrewAI agents native Geonode web scraping tools to extract pages, search the web, discover URLs and manage crawl or batch jobs."
authors = [
  {name = "Geonode Team"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "geonode-scraper-tools-core>=0.5.0",
  "crewai>=0.100",
]

[project.urls]
Homepage = "https://geonode.com/integrations"
Documentation = "https://docs.geonode.com/docs/scraper-api/guides/sdks/crewai"
Repository = "https://github.com/geonodecom/integration-crewai"
"Sign up" = "https://app.geonode.com/sign-up?utm_source=pypi&utm_medium=package&utm_campaign=crewai"
Issues = "https://github.com/geonodecom/integration-crewai/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12.11",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geonode_scraper_crewai*"]

[tool.setuptools.package-data]
geonode_scraper_crewai = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
